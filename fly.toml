# Fly.io config — deploys the Dockerfile as-is.
# Trial mode: machines stop when idle so the no-card trial's 2 VM-hours last.
# Going to production: set auto_stop_machines = "off" and
# min_machines_running = 1 (no cold starts). SQLite on a volume means exactly
# one machine — never scale this app out.

app = "dipen-ipod-classic"
primary_region = "iad"

[env]
  VIDEOS_DIR = "/data/videos/ugg"

[[mounts]]
  source = "ipod_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
